name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-platform-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-platform-backend:${{ github.sha }}

    
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          # file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-platform-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-platform-frontend:${{ github.sha }}

