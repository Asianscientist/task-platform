apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: task-platform
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: task-platform
    spec:
      containers:
      - name: frontend
        image: task-platform/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5173
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        
