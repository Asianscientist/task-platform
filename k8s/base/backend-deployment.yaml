apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: task-platform
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: task-platform/backend:latest
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3


      env:
        - name: DATABASE_URL
          value: postgresql+psycopg://taskuser:$(POSTGRES_PASSWORD)@postgres:5432/tasks
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: task-platform-config 
              key: REDIS_URL
        - name: QUEUE_NAME
          valueFrom:
            configMapKeyRef: 
              name: task-platform-config
              key: QUEUE_NAME
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef: 
              name: task-platform-config
              key: CORS_ORIGINS
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: task-platform-config
              key: ACCESS_TOKEN_EXPIRE_MINUTES
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-platform-secret
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: 
              name: task-platform-secret 
              key: JWT_SECRET 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1