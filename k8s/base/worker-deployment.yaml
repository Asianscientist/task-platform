apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: task-platform
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: task-platform
    spec:
      containers:
      - name: worker
        image: task-platform/backend:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "worker.main"]
        ports:
        - containerPort: 8001
          name: metrics
        env:
            - name: DATABASE_URL
              value: postgresql+psycopg://taskuser:$(POSTGRES_PASSWORD)@postgres:5432/tasks
            - name: REDIS_URL
              valueFrom: { configMapKeyRef: { name: task-platform-config, key: REDIS_URL } }
            - name: QUEUE_NAME
              valueFrom: { configMapKeyRef: { name: task-platform-config, key: QUEUE_NAME } }
            - name: WORKER_METRICS_PORT
              valueFrom: { configMapKeyRef: { name: task-platform-config, key: WORKER_METRICS_PORT } }
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: task-platform-secret, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: task-platform-secret, key: JWT_SECRET } }
        