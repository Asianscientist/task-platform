apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: task-platform
  labels:
    app: redis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: task-platform

    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            name: redis
            containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
