apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-platform
  namespace: task-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: "task-platform.local"
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: nginx
            port:
              number: http
