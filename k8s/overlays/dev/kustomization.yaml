apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-platform

resources:
  - ../../base

images:
  - name: task-platform/backend
    newName: task-platform/backend
    newTag: dev
  - name: task-platform/frontend
    newName: task-platform/frontend
    newTag: dev

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1
  - name: nginx
    count: 1
  - name: worker
    count: 1