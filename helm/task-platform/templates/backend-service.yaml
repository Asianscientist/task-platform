apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    {{- include "task-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP