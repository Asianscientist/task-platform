namespace: task-platform

backend:
  replicas: 2
  image:
    repository: task-platform/backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    port: 8000

monitoring:
  enabled: true
  labels:
    release: monitoring

frontend:
  replicas: 2
  image:
    repository: task-platform/frontend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    port: 5173

worker:
  replicas: 3
  image:
    repository: task-platform/backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001

postgres:
  replicas: 1
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 1Gi
  service:
    port: 5432
    type: ClusterIP

redis:
  replicas: 1
  image:
    repository: redis
    tag: "7-alpine"
  service:
    port: 6379
    type: ClusterIP

nginx:
  replicas: 2
  image:
    repository: nginx
    tag: "1.14.2"
  service:
    port: 80

ingress:
  enabled: true
  className: nginx
  host: task-platform.local

resources:
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  worker:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi